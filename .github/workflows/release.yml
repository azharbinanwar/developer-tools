name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./test.sh
      - name: tag must match the VERSION in every script
        run: |
          for f in ship-apk/ship-apk ship-site/ship-site developer-tools; do
            grep -q "^VERSION=\"${GITHUB_REF_NAME#v}\"" "$f" || { echo "$f is not at $GITHUB_REF_NAME"; exit 1; }
          done
      - name: release notes from commit titles since the previous tag
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          { echo "## What changed"; echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
            echo; echo "## Install"; echo
            echo '```sh'; echo 'brew install azharbinanwar/tap/developer-tools'; echo '```'
            echo; echo "Or run without installing: see the [README](https://github.com/azharbinanwar/developer-tools#readme)."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ship-apk/ship-apk
            ship-site/ship-site
            developer-tools
          body_path: notes.md

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: azharbinanwar/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: render formulas with the release sha256 and push them to the tap
        run: |
          v="${GITHUB_REF_NAME#v}"
          homebrew/render "$v" "https://github.com/azharbinanwar/developer-tools/releases/download/v$v" tap/Formula
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          git diff --cached --quiet || { git commit -m "developer-tools v$v"; git push; }
